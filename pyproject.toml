[project]
name = "techchall-simpostraing-2026"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "torch==2.14.1+cu130",
    "transformers>=4.47,<5",
    "datasets",
    "accelerate",
    "sympy>=1.14.0",
    "latex2sympy2-extended>=1.11.0",
    "math-verify>=0.9.0",
    "pylatexenc>=2.11",
    "tensorboard>=2.21.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
